# Publish mousike to PyPI using Trusted Publishing (no API tokens), and attach
# the Mousike Notation font zip to the GitHub release.
# Runs when you publish a GitHub release whose tag matches the version in
# pyproject.toml, e.g. tag v0.1.0 for version = "0.1.0".
name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check release tag matches package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, sys, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["TAG"]
          if tag.lstrip("v") != version:
              sys.exit(f"Release tag {tag!r} doesn't match pyproject.toml version {version!r}")
          print(f"Tag {tag} matches version {version}")
          PY
      - name: Install build tools
        run: python -m pip install --upgrade build pytest mido fonttools
      - name: Run tests
        run: python -m pytest -q
      - name: Build sdist and wheel
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mousike
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  font-download:
    # Latest always at
    # https://github.com/neelsmith/mousike/releases/latest/download/MousikeNotation.zip
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to attach files to the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Package the font
        run: python fonts/package.py
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" fonts/dist/MousikeNotation.zip --clobber
