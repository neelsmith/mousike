# Publish mousike to PyPI using Trusted Publishing (no API tokens), and attach
# the Mousike Notation font zip to the GitHub release.
# Runs when you publish a GitHub release. The build aligns pyproject.toml's
# version to the release tag (for example, tag v0.1.0 -> version 0.1.0).
name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Align package version with release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["TAG"].lstrip("v")
          pyproject = Path("pyproject.toml")
          text = pyproject.read_text()
          match = re.search(r'^version\s*=\s*"([^"]+)"\s*$', text, flags=re.MULTILINE)
          if not match:
              raise SystemExit("Could not find project version in pyproject.toml")
          version = match.group(1)
          if version != tag:
              print(f"Updating pyproject.toml version from {version} to {tag} to match release tag")
              pyproject.write_text(text[:match.start(1)] + tag + text[match.end(1):])
          else:
              print(f"Tag v{tag} matches version {version}")
          PY
      - name: Install build tools
        run: python -m pip install --upgrade build pytest mido fonttools
      - name: Run tests
        run: python -m pytest -q
      - name: Build sdist and wheel
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mousike
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  font-download:
    # Latest always at
    # https://github.com/neelsmith/mousike/releases/latest/download/MousikeNotation.zip
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to attach files to the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Package the font
        run: python fonts/package.py
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" fonts/dist/MousikeNotation.zip --clobber
