project:
  type: website
  output-dir: quarto_build

version: "0.2.0"
metadata:
  date: today
  
execute:
  freeze: auto
date: last-modified  

format:
  html:
    theme:
      - cosmo
      - brand
    toc: true

website:
  title: "mousike"
  page-footer:
    center: "`mousike` version **{{< meta version >}}**, website last updated {{< meta date >}}"

  navbar:
    background: primary
    search: true
    left:
      - text: "Texts"
        file: texts/index.qmd
      - text: "MIDI"
        file: midi/index.qmd
      - text: "Instruments"
        file: instruments/index.qmd        
      - text: "Tutorials"
        file: tutorial/index.qmd
      - text: "Technical"
        file: technical/index.qmd        

            
          

    right:
      - icon: person-circle
        menu:
          - text: "mousike on github"
            href: https://github.com/neelsmith/mousike
          - text: "Neel Smith"
            href: https://neelsmith.github.io/
        aria-label: Home 

  sidebar:
    - title: "Texts"
      contents:
        - texts/index.qmd
        - "---"
        - encoding/index.qmd
        - alignment/index.qmd
